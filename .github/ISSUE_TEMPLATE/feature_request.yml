name: Feature request
description: Suggest something an area or floor card should show or do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the room or the dashboard, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
